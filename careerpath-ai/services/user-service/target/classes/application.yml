server:
  port: 8001

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/careerpath
    username: careerpath_user
    password: change_me_strong_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://127.0.0.1:8484/realms/careerpath
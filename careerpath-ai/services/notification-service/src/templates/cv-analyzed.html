<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CV Analysis Complete</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 0;">
  <div style="max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
    <div style="background: #10B981; color: #ffffff; padding: 20px 24px;">
      <h1 style="margin: 0; font-size: 22px;">CareerPathAI</h1>
      <p style="margin: 4px 0 0 0; opacity: 0.9;">CV Analysis Complete</p>
    </div>
    <div style="padding: 24px;">
      <p style="font-size: 16px; color: #111827;">Hi,</p>
      <p style="font-size: 16px; color: #111827;">We finished analyzing your CV. Here is your parser score:</p>
      <div style="text-align: center; margin: 24px 0;">
        <div style="display: inline-block; background: #ECFDF5; color: #047857; font-size: 36px; font-weight: bold; padding: 16px 32px; border-radius: 8px;">
          {{score}}%
        </div>
      </div>
      <p style="font-size: 14px; color: #6B7280;">Log in to CareerPathAI to see the detailed breakdown and your personalized next steps.</p>
    </div>
    <div style="padding: 16px 24px; background: #F9FAFB; color: #9CA3AF; font-size: 12px; text-align: center;">
      &copy; CareerPathAI — automated message, please do not reply.
    </div>
  </div>
</body>
</html>

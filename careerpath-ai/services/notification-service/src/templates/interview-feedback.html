<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Interview Evaluation</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 0;">
  <div style="max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
    <div style="background: #10B981; color: #ffffff; padding: 20px 24px;">
      <h1 style="margin: 0; font-size: 22px;">CareerPathAI</h1>
      <p style="margin: 4px 0 0 0; opacity: 0.9;">Interview Evaluation</p>
    </div>
    <div style="padding: 24px;">
      <p style="font-size: 16px; color: #111827;">Your AI simulation interview is complete. Here are your scores:</p>
      <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
        <tr>
          <td style="padding: 12px; background: #F0FDF4; border-radius: 6px; width: 50%; text-align: center;">
            <div style="font-size: 12px; color: #065F46; text-transform: uppercase; letter-spacing: 0.05em;">HR Score</div>
            <div style="font-size: 28px; color: #047857; font-weight: bold; margin-top: 4px;">{{hrScore}}%</div>
          </td>
          <td style="width: 16px;"></td>
          <td style="padding: 12px; background: #EFF6FF; border-radius: 6px; width: 50%; text-align: center;">
            <div style="font-size: 12px; color: #1E40AF; text-transform: uppercase; letter-spacing: 0.05em;">Technical Score</div>
            <div style="font-size: 28px; color: #1D4ED8; font-weight: bold; margin-top: 4px;">{{techScore}}%</div>
          </td>
        </tr>
      </table>
      <h3 style="font-size: 16px; color: #111827; margin-bottom: 8px;">Improvement areas</h3>
      <p style="font-size: 14px; color: #4B5563; background: #FFFBEB; border-left: 4px solid #F59E0B; padding: 12px; line-height: 1.5;">
        {{improvementAreas}}
      </p>
    </div>
    <div style="padding: 16px 24px; background: #F9FAFB; color: #9CA3AF; font-size: 12px; text-align: center;">
      &copy; CareerPathAI — automated message, please do not reply.
    </div>
  </div>
</body>
</html>

version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  CareerPath AI — Docker Compose (Development)
#
#  PROFILES — porneste doar ce ai nevoie:
#
#  Agenti AI (Rares):   docker-compose --profile agents up
#  Backend (Francis):   docker-compose --profile backend up
#  Frontend:            docker-compose --profile frontend --profile backend up
#  Observabilitate:     docker-compose --profile observability up
#  Tot:                 docker-compose --profile frontend --profile backend --profile agents --profile observability up
#
#  Infrastructura (postgres, redis, qdrant, redpanda, minio) porneste MEREU,
#  indiferent de profile.
# ─────────────────────────────────────────────────────────────────────────────

x-python-ai: &python-ai-defaults
  restart: unless-stopped
  env_file: .env
  networks: [internal-net]
  depends_on:
    postgres:   { condition: service_healthy }
    redis:      { condition: service_healthy }
    redpanda:   { condition: service_healthy }

x-node-svc: &node-defaults
  restart: unless-stopped
  env_file: .env
  networks: [internal-net]

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  redpanda_data:

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Layer 1 · Frontend ─────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: cp-frontend
    ports: ["3000:3000"]
    env_file: .env
    networks: [public-net]
    depends_on: [api-gateway]
    restart: unless-stopped
    profiles: [frontend]

  # ── Layer 2 · API Gateway ──────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: cp-gateway
    ports: ["8000:8000"]
    env_file: .env
    networks: [public-net, internal-net]
    depends_on: [user-service]
    restart: unless-stopped
    profiles: [backend, frontend]

  # ── Layer 3 · Core Services ────────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    container_name: cp-user-service
    ports: ["8001:8001"]
    <<: *node-defaults
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    profiles: [backend, frontend]

  cv-service:
    build: ./services/cv-service
    container_name: cp-cv-service
    ports: ["8002:8002"]
    <<: *python-ai-defaults
    depends_on:
      postgres:  { condition: service_healthy }
      minio:     { condition: service_started }
      redpanda:  { condition: service_healthy }
    profiles: [backend]

  job-scraper-service:
    build: ./services/job-scraper-service
    container_name: cp-job-scraper
    ports: ["8003:8003"]
    <<: *python-ai-defaults
    profiles: [backend]

  notification-service:
    build: ./services/notification-service
    container_name: cp-notification
    ports: ["8004:8004"]
    <<: *node-defaults
    depends_on:
      redpanda: { condition: service_healthy }
    profiles: [backend]

  # ── Layer 4 · AI Agent Services ───────────────────────────────────────────
  agent-orchestrator:
    build: ./services/agent-orchestrator
    container_name: cp-orchestrator
    ports: ["8005:8005"]
    <<: *python-ai-defaults
    profiles: [agents]

  cv-analyzer-agent:
    build: ./services/cv-analyzer-agent
    container_name: cp-cv-analyzer
    ports: ["8006:8006"]
    <<: *python-ai-defaults
    depends_on:
      qdrant:   { condition: service_started }
    profiles: [agents]

  learning-path-agent:
    build: ./services/learning-path-agent
    container_name: cp-learning-agent
    ports: ["8007:8007"]
    <<: *python-ai-defaults
    profiles: [agents]

  job-match-agent:
    build: ./services/job-match-agent
    container_name: cp-job-match
    ports: ["8008:8008"]
    <<: *python-ai-defaults
    depends_on:
      qdrant:   { condition: service_started }
    profiles: [agents]

  hr-interview-agent:
    build: ./services/hr-interview-agent
    container_name: cp-hr-agent
    ports: ["8009:8009"]
    <<: *python-ai-defaults
    profiles: [agents]

  technical-interview-agent:
    build: ./services/technical-interview-agent
    container_name: cp-tech-agent
    ports: ["8010:8010"]
    <<: *python-ai-defaults
    profiles: [agents]

  # ── Layer 5 · Infrastructure (fara profile — porneste mereu) ──────────────
  postgres:
    image: postgres:16-alpine
    container_name: cp-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-careerpath}
      POSTGRES_USER:     ${POSTGRES_USER:-cp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cp_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack:7.4.0-v1
    container_name: cp-redis
    ports: ["6379:6379", "8091:8001"]         # 8091 = RedisInsight UI (8001 used by user-service)
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [internal-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: cp-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infrastructure/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks: [internal-net]
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: cp-redpanda
    ports: ["9092:9092", "9644:9644"]
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --default-log-level=warn
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks: [internal-net]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v2.5.2
    container_name: cp-redpanda-console
    ports: ["8080:8080"]
    environment:
      CONFIG_FILEPATH: /etc/redpanda/console-config.yaml
    volumes:
      - ./infrastructure/redpanda/console-config.yaml:/etc/redpanda/console-config.yaml:ro
    depends_on: [redpanda]
    networks: [internal-net]
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: cp-minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_minio}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [internal-net]
    restart: unless-stopped

  # ── Layer 6 · Observability ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: cp-otel-collector
    volumes:
      - ./observability/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cp-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  loki:
    image: grafana/loki:3.0.0
    container_name: cp-loki
    ports: ["3100:3100"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  tempo:
    image: grafana/tempo:2.5.0
    container_name: cp-tempo
    ports: ["3200:3200"]
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cp-grafana
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, loki, tempo]
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

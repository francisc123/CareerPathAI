global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: user-service
    static_configs:
      - targets: ["user-service:8001"]

  - job_name: cv-service
    static_configs:
      - targets: ["cv-service:8002"]

  - job_name: job-scraper
    static_configs:
      - targets: ["job-scraper-service:8003"]

  - job_name: agent-orchestrator
    static_configs:
      - targets: ["agent-orchestrator:8005"]

  - job_name: cv-analyzer-agent
    static_configs:
      - targets: ["cv-analyzer-agent:8006"]

  - job_name: learning-path-agent
    static_configs:
      - targets: ["learning-path-agent:8007"]

  - job_name: job-match-agent
    static_configs:
      - targets: ["job-match-agent:8008"]

  - job_name: hr-interview-agent
    static_configs:
      - targets: ["hr-interview-agent:8009"]

  - job_name: technical-interview-agent
    static_configs:
      - targets: ["technical-interview-agent:8010"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:9187"]   # postgres_exporter sidecar

  - job_name: redis
    static_configs:
      - targets: ["redis:9121"]      # redis_exporter sidecar

  - job_name: redpanda
    static_configs:
      - targets: ["redpanda:9644"]   # Redpanda native Prometheus endpoint

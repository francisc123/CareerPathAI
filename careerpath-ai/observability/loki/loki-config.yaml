auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Embedded single-binary scheduler — no need for memberlist or external KV
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Disable analytics ping to grafana.net
analytics:
  reporting_enabled: false

# Generous limits for dev — no rate-limiting headaches when replaying logs
limits_config:
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  retention_period: 168h
  allow_structured_metadata: true
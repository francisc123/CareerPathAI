version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
#  CareerPath AI — Docker Compose (Development Unificat)
#
#  PROFILES — porneste doar ce ai nevoie:
#  Agenti AI:           docker-compose --profile agents up
#  Backend:             docker-compose --profile backend up
#  Frontend:            docker-compose --profile frontend --profile backend up
#  Observabilitate:     docker-compose --profile observability up
# ─────────────────────────────────────────────────────────────────────────────

x-python-ai: &python-ai-defaults
  restart: unless-stopped
  env_file: .env
  networks: [internal-net]
  depends_on:
    postgres:   { condition: service_healthy }
    redis:      { condition: service_healthy }
    redpanda:   { condition: service_healthy }

x-node-svc: &node-defaults
  restart: unless-stopped
  env_file: .env
  networks: [internal-net]

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  redpanda_data:

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── Layer 1 · Frontend ─────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: cp-frontend
    ports: ["3000:3000"]
    env_file: .env
    networks: [public-net]
    depends_on: [api-gateway]
    restart: unless-stopped
    profiles: [frontend]

  # ── Layer 2 · API Gateway ──────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: production
    container_name: api-gateway-1
    networks:
      - public-net
      - internal-net
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
    volumes:
      - ./keys:/app/keys:ro

  # ── Layer 3 · Core Services ────────────────────────────────────────────────
  user-service:
    build: ./services/user-service
    container_name: cp-user-service
    ports: ["8001:8001"]
    <<: *node-defaults
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    profiles: [backend, frontend]

  cv-service:
    build:
      context: .
      dockerfile: services/cv-service/Dockerfile
    container_name: cp-cv-service
    ports: ["8002:8002"]
    environment:
      - PYTHONPATH=/app:/app/src:/
    <<: *python-ai-defaults
    depends_on:
      postgres:  { condition: service_healthy }
      minio:     { condition: service_started }
      redpanda:  { condition: service_healthy }
    profiles: [backend]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: cp-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: "none"
    ports:
      - "8484:8080"
    networks:
      - public-net
      - internal-net
    restart: unless-stopped

  job-scraper-service:
    build: ./services/job-scraper-service
    container_name: cp-job-scraper
    ports: ["8003:8003"]
    <<: *python-ai-defaults
    profiles: [backend]

  notification-service:
    build: ./services/notification-service
    container_name: cp-notification
    ports: ["8004:8004"]
    <<: *node-defaults
    depends_on:
      redpanda: { condition: service_healthy }
    healthcheck: disable
    environment:
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - EMAIL_FROM=no-reply@careerpathai.com
    profiles: [backend]

  # ── Layer 4 · AI Agent Services ───────────────────────────────────────────
  agent-orchestrator:
    build: ./services/agent-orchestrator
    container_name: cp-orchestrator
    ports: ["8005:8005"]
    <<: *python-ai-defaults
    profiles: [agents]

  cv-analyzer-agent:
    build: ./services/cv-analyzer-agent
    container_name: cp-cv-analyzer
    ports: ["8006:8006"]
    <<: *python-ai-defaults
    depends_on:
      qdrant:   { condition: service_started }
    profiles: [agents]

  learning-path-agent:
    build: ./services/learning-path-agent
    container_name: cp-learning-agent
    ports: ["8007:8007"]
    <<: *python-ai-defaults
    profiles: [agents]

  job-match-agent:
    build: ./services/job-match-agent
    container_name: cp-job-match
    ports: ["8008:8008"]
    <<: *python-ai-defaults
    depends_on:
      qdrant:   { condition: service_started }
    profiles: [agents]

  hr-interview-agent:
    build: ./services/hr-interview-agent
    container_name: cp-hr-agent
    ports: ["8009:8009"]
    <<: *python-ai-defaults
    profiles: [agents]

  technical-interview-agent:
    build: ./services/technical-interview-agent
    container_name: cp-tech-agent
    ports: ["8010:8010"]
    <<: *python-ai-defaults
    profiles: [agents]

  # ── Layer 5 · Infrastructure (Fara profile — porneste mereu) ──────────────
  postgres:
    image: postgres:16-alpine
    container_name: cp-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-careerpath}
      POSTGRES_USER:     ${POSTGRES_USER:-cp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cp_user} -d ${POSTGRES_DB:-careerpath}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cp-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    container_name: cp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: cp-qdrant
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infrastructure/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks: [internal-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: cp-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - internal-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9644/v1/status/ready" ]
      interval: 10s
      retries: 10

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: cp-redpanda-console
    volumes:
      - ./infrastructure/redpanda/console-config.yaml:/etc/redpanda/admin-config.yaml
    environment:
      CONFIG_FILEPATH: /etc/redpanda/admin-config.yaml
    ports:
      - "8080:8080"
    networks:
      - public-net
      - internal-net
    depends_on:
      redpanda: { condition: service_healthy }

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: cp-minio
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me_minio}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [internal-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
    restart: unless-stopped

  # ── Layer 6 · Observability ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: cp-otel-collector
    volumes:
      - ./observability/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cp-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  loki:
    image: grafana/loki:3.0.0
    container_name: cp-loki
    ports: ["3100:3100"]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  tempo:
    image: grafana/tempo:2.5.0
    container_name: cp-tempo
    ports: ["3200:3200"]
    volumes:
      - ./observability/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: cp-grafana
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus, loki, tempo]
    networks: [internal-net]
    restart: unless-stopped
    profiles: [observability]